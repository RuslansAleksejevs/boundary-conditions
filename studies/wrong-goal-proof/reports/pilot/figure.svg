inus B (primary)</text><line x1="195.61365332192122" y1="365" x2="709.3863466780788" y2="365" stroke="#a9c4d2" stroke-width="6"/><line x1="452.5" y1="365" x2="452.5" y2="365" stroke="#1b668c" stroke-width="2"/><circle cx="452.5" cy="365" r="4" fill="#1b668c"/><text x="744" y="370" font-size="16" fill="#172b3a">8/8 complete pairs</text><text x="24" y="410" font-size="16" fill="#172b3a">N minus B</text><line x1="195.61365332192122" y1="405" x2="709.3863466780788" y2="405" stroke="#a9c4d2" stroke-width="6"/><line x1="452.5" y1="405" x2="452.5" y2="405" stroke="#1b668c" stroke-width="2"/><circle cx="452.5" cy="405" r="4" fill="#1b668c"/><text x="744" y="410" font-size="16" fill="#172b3a">8/8 complete pairs</text><text x="24" y="486" font-size="16" fill="#172b3a">Natural pipeline: changed C/Q 0/7 valid translations; correct originals 7/8.</text><text x="24" y="510" font-size="16" fill="#516575">A/B: marginal 95% Wilson intervals; pale range in A marks missingness bounds when needed.</text><text x="24" y="528" font-size="16" fill="#516575">C: dark paired bootstrap; pale bounded-iid Hoeffding interval. Shared templates limit inference.</text><text x="24" y="546" font-size="16" fill="#516575">B = PASS; N = neutral; S = explicit scope. All arms see the original task and identical evidence.</text></g></svg>
